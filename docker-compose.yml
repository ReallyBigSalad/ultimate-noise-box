version: '2'
volumes:
  shared-data:
  minio-data:
  redis-data:
  web-data:
services:
  audio:
    restart: always
    image: bh.cr/balenalabs/audio-armv7hf
    privileged: true
    ports:
      - 4317:4317
  noise:
    restart: always
    build: ./noise
    privileged: true
    volumes:
      - 'shared-data:/data/my_data'
    ports:
      - "8080:8080"
    environment:
      PULSE_SERVER: tcp:audio:4317
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    restart: always
    volumes:
      - 'minio-data:/data'
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    user: "0:0"
  redis:
    restart: always
    image: redis:6.2.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
  webserver:
    restart: always
    build: ./webserver
    ports:
      - 80:80
    volumes:
      - 'shared-data:/data/my_data'
  controller:
    restart: always
    privileged: true
    build: ./controller
    volumes:
      - 'shared-data:/data/my_data'
    labels:
      io.balena.features.supervisor-api: '1'
